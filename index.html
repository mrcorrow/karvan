<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Karvan — Karavancılar için kamp keşfi</title>
    <meta
      name="description"
      content="Türkiye'nin karavan dostu kamp alanlarını keşfet: harita, filtreler, favoriler, gezi planlayıcı ve maliyet hesabı."
    />
    <meta name="theme-color" content="#0f3d2e" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Karvan" />
    <link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin />
    <link rel="dns-prefetch" href="https://tile.openstreetmap.org" />
    <style>
      /* İlk boyama iskeleti: uygulama yüklenirken boş beyaz ekran görünmesin */
      #splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 14px;
        background: #0f3d2e;
        color: #f7f3e8;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        z-index: 9999;
        transition: opacity 0.35s ease;
      }
      #splash svg {
        animation: bob 1.4s ease-in-out infinite;
      }
      @keyframes bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-7px);
        }
      }
      #splash p {
        margin: 0;
        letter-spacing: 0.34em;
        font-size: 13px;
        text-transform: uppercase;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <svg width="66" height="66" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <path
          d="M6 40h8m36 0h-4M10 40l4-13a5 5 0 0 1 4.7-3.4h14.6c3 0 5.6 2 6.3 4.9L42 40H10Z"
          stroke="#f2a65a"
          stroke-width="3.4"
          stroke-linejoin="round"
        />
        <circle cx="19" cy="46" r="5" stroke="#f7f3e8" stroke-width="3.2" />
        <circle cx="38" cy="46" r="5" stroke="#f7f3e8" stroke-width="3.2" />
        <path d="M46 30h8a4 4 0 0 1 4 4v6H46" stroke="#e07a5f" stroke-width="3.4" stroke-linejoin="round" />
      </svg>
      <p>Karvan</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
